disabled_rules:
  - trailing_whitespace
opt_in_rules:
  - empty_count
  - empty_string
  - first_where
  - force_unwrapping
  - implicit_return
included:
  - GuardCall
  - GuardCallDirectory
  - GuardCallTests
  - android/app/src
excluded:
  - DerivedData
  - android/build
  - android/.gradle
line_length: 140
type_body_length:
  warning: 400
  error: 600
file_length:
  warning: 600
  error: 1000
reporter: "xcode"
