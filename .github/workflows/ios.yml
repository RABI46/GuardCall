name: iOS CI

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (XcodeGen + Simulator)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          test -d GuardCall.xcodeproj || { echo "::error::GuardCall.xcodeproj manquant"; exit 1; }
          xcodebuild -list -project GuardCall.xcodeproj

      - name: Select simulator
        id: simulator
        run: |
          set -euo pipefail
          DEVICE="iPhone 16"
          if ! xcrun simctl list devices available | grep -q "$DEVICE"; then
            DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+' | head -1)
            [ -n "$DEVICE" ] || DEVICE="iPhone 15"
          fi
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "Simulateur retenu : $DEVICE"

      # `set -o pipefail` est indispensable : sans lui, le code de sortie de
      # l'étape est celui de `tail`, donc 0 même quand xcodebuild échoue.
      - name: Build for testing
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project GuardCall.xcodeproj \
            -scheme GuardCall \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.device }},OS=latest" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/build.log | tail -n 200

      - name: Run tests
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -project GuardCall.xcodeproj \
            -scheme GuardCall \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.device }},OS=latest" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            -enableCodeCoverage YES \
            -resultBundlePath /tmp/GuardCallTests.xcresult 2>&1 | tee /tmp/test.log | tail -n 300

      - name: Test summary
        if: always()
        run: |
          set -uo pipefail
          {
            echo "### Tests iOS"
            echo '```'
            grep -E "Test Suite|Test Case.*(passed|failed)|Executed [0-9]+ test" /tmp/test.log | tail -n 60 || echo "aucune sortie de test"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install SwiftLint
        run: |
          set -euo pipefail
          if ! command -v swiftlint >/dev/null 2>&1; then
            brew install swiftlint
          fi
          swiftlint version

      # Bloquant sur les erreurs SwiftLint (les avertissements restent visibles
      # dans le log sans faire échouer le build).
      - name: SwiftLint
        run: |
          set -euo pipefail
          swiftlint lint --reporter github-actions-logging
