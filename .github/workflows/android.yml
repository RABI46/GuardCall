name: Android CI

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build APK (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la $ANDROID_HOME 2>&1 | head -n 40 || ls -la /usr/local/lib/android/sdk 2>&1 | head -n 40
          which sdkmanager 2>&1 | head
          sdkmanager --version 2>&1 | head || echo "sdkmanager not in PATH, trying fallback"
          ls $ANDROID_HOME/cmdline-tools 2>&1 | head -n 20 || true
          # Accept licenses if sdkmanager available
          yes | sdkmanager --licenses 2>&1 | tail -n 5 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Generate Gradle Wrapper (if missing jar)
        working-directory: android
        continue-on-error: true
        run: |
          set -x
          ls -la gradle/wrapper/ 2>&1 | head -n 20 || true
          gradle --version 2>&1 | head -n 20
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Wrapper jar missing — generation avec Gradle 8.7"
            gradle wrapper --gradle-version 8.7 2>&1 | tail -n 100 || echo "gradle wrapper failed, trying alternative"
            ls -lh gradle/wrapper/ 2>&1 | head -n 20 || true
          else
            echo "Wrapper jar present"
            ls -lh gradle/wrapper/
          fi
          # fallback: if still missing, use gradle directly without wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "No wrapper jar — will use gradle directly for build"
          fi

      - name: Build Debug APK
        working-directory: android
        run: |
          set -x
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Using ./gradlew"
            ./gradlew assembleDebug --stacktrace 2>&1 | tail -n 300
          else
            echo "Wrapper missing, using gradle directly"
            gradle assembleDebug --stacktrace 2>&1 | tail -n 300
          fi
          ls -lh app/build/outputs/apk/debug/ 2>&1 | head -n 20 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GuardCall-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Run unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest || echo "no tests yet — ok"
