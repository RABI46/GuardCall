name: Android CI

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build APK (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la $ANDROID_HOME 2>&1 | head -n 40 || ls -la /usr/local/lib/android/sdk 2>&1 | head -n 40
          which sdkmanager 2>&1 | head
          sdkmanager --version 2>&1 | head || echo "sdkmanager not in PATH, trying fallback"
          ls $ANDROID_HOME/cmdline-tools 2>&1 | head -n 20 || true
          # Accept licenses if sdkmanager available
          yes | sdkmanager --licenses 2>&1 | tail -n 5 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Generate Gradle Wrapper (if missing jar)
        working-directory: android
        continue-on-error: true
        run: |
          set -x
          ls -la gradle/wrapper/ 2>&1 | head -n 20 || true
          gradle --version 2>&1 | head -n 20
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Wrapper jar missing — generation avec Gradle 8.7"
            gradle wrapper --gradle-version 8.7 2>&1 | tail -n 100 || echo "gradle wrapper failed, trying alternative"
            ls -lh gradle/wrapper/ 2>&1 | head -n 20 || true
          else
            echo "Wrapper jar present"
            ls -lh gradle/wrapper/
          fi
          # fallback: if still missing, use gradle directly without wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "No wrapper jar — will use gradle directly for build"
          fi

      - name: Validate Gradle project
        working-directory: android
        run: |
          set -x
          gradle help 2>&1 | head -n 50 || true
          gradle projects 2>&1 | head -n 50 || true

      - name: Build Debug APK
        working-directory: android
        run: |
          set -o pipefail
          set -x
          echo "=== PWD ===" && pwd && ls -la
          echo "=== gradle files ===" && ls -la gradle/wrapper/ 2>&1 | head -n 20 || true
          # Run gradle with log file, without pipe to preserve exit code
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Using ./gradlew"
            ./gradlew assembleDebug --stacktrace > /tmp/gradle.log 2>&1
            GRADLE_EXIT=$?
          else
            echo "Wrapper missing, using gradle directly"
            gradle assembleDebug --stacktrace > /tmp/gradle.log 2>&1
            GRADLE_EXIT=$?
          fi
          echo ">>> gradle exit: $GRADLE_EXIT"
          tail -n 800 /tmp/gradle.log || true
          echo "=== find APKs ==="
          find . -name "*.apk" -type f 2>&1 | head -n 20 || true
          find app/build -type f 2>&1 | head -n 150 || true
          ls -R app/build 2>&1 | head -n 400 || true
          echo "=== gradle.log errors (filtered) ==="
          grep -i -A6 -B2 "error\|FAILED\|exception\|e:" /tmp/gradle.log | head -n 800 || true
          # also dump to summary
          {
            echo "### Gradle log tail"
            echo '```'
            tail -n 500 /tmp/gradle.log || true
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          # fail job if gradle failed
          if [ "$GRADLE_EXIT" -ne 0 ]; then
            echo "::error::Gradle build failed with exit $GRADLE_EXIT"
            exit $GRADLE_EXIT
          fi
          if ! find . -name "*.apk" | grep -q .; then
            echo "::error::No APK produced!"
            exit 1
          fi

      - name: Upload gradle log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: /tmp/gradle.log
          retention-days: 7
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GuardCall-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/**/*.apk
            android/**/build/outputs/**/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Run unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest || echo "no tests yet — ok"
