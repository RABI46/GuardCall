name: Android CI

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  issues: write
  checks: write

jobs:
  build:
    name: Build APK (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la $ANDROID_HOME 2>&1 | head -n 40 || ls -la /usr/local/lib/android/sdk 2>&1 | head -n 40
          which sdkmanager 2>&1 | head
          sdkmanager --version 2>&1 | head || echo "sdkmanager not in PATH, trying fallback"
          ls $ANDROID_HOME/cmdline-tools 2>&1 | head -n 20 || true
          # Accept licenses if sdkmanager available
          yes | sdkmanager --licenses 2>&1 | tail -n 5 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Generate Gradle Wrapper (if missing jar)
        working-directory: android
        continue-on-error: true
        run: |
          set -x
          ls -la gradle/wrapper/ 2>&1 | head -n 20 || true
          gradle --version 2>&1 | head -n 20
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Wrapper jar missing — generation avec Gradle 8.7"
            gradle wrapper --gradle-version 8.7 2>&1 | tail -n 100 || echo "gradle wrapper failed, trying alternative"
            ls -lh gradle/wrapper/ 2>&1 | head -n 20 || true
          else
            echo "Wrapper jar present"
            ls -lh gradle/wrapper/
          fi
          # fallback: if still missing, use gradle directly without wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "No wrapper jar — will use gradle directly for build"
          fi

      - name: Validate Gradle project
        working-directory: android
        run: |
          set -x
          gradle help 2>&1 | head -n 50 || true
          gradle projects 2>&1 | head -n 50 || true

      - name: Build Debug APK
        working-directory: android
        run: |
          set -o pipefail
          set -x
          echo "=== PWD ===" && pwd && ls -la
          echo "=== gradle files ===" && ls -la gradle/wrapper/ 2>&1 | head -n 20 || true
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Using ./gradlew"
            ./gradlew assembleDebug --stacktrace > /tmp/gradle.log 2>&1
            GRADLE_EXIT=$?
          else
            echo "Wrapper missing, using gradle directly"
            gradle assembleDebug --stacktrace > /tmp/gradle.log 2>&1
            GRADLE_EXIT=$?
          fi
          echo ">>> gradle exit: $GRADLE_EXIT"
          echo "=== HEAD ===" && head -n 150 /tmp/gradle.log || true
          echo "=== TAIL ===" && tail -n 600 /tmp/gradle.log || true
          echo "=== find APKs ==="
          find . -name "*.apk" -type f 2>&1 | head -n 20 || true
          ls -R app/build 2>&1 | head -n 500 || true
          echo "=== errors ==="
          grep -i -n -A8 -B2 "FAILURE\|> Task.*FAILED\|e: \|error:" /tmp/gradle.log | head -n 500 || true
          {
            echo "### Gradle head"
            echo '```'
            head -n 150 /tmp/gradle.log || true
            echo '```'
            echo "### Gradle tail"
            echo '```'
            tail -n 400 /tmp/gradle.log || true
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          if [ "$GRADLE_EXIT" -ne 0 ]; then
            echo "::error::Gradle build failed with exit $GRADLE_EXIT"
            exit $GRADLE_EXIT
          fi
          if ! find . -name "*.apk" | grep -q .; then
            echo "::error::No APK produced!"
            exit 1
          fi

      - name: Post log to issue on failure
        if: failure()
        run: |
          echo "Posting gradle log..."
          if [ -f /tmp/gradle.log ]; then
            echo "=== HEAD 100 ===" 
            head -n 100 /tmp/gradle.log || true
            echo "=== GREP errors ==="
            grep -i -m1 -A15 "FAILURE\|> Task :app.*FAILED\|e: \|error:" /tmp/gradle.log 2>&1 | head -n 50 || true
            # For annotation, capture first error (not tail)
            ERR=$(grep -i -m1 -A8 "FAILURE\|e: \|error:" /tmp/gradle.log 2>&1 | tr '\n' ' ' | sed 's/"/\\"/g' | head -c 3000)
            if [ -z "$ERR" ]; then
              ERR=$(head -n 40 /tmp/gradle.log | tr '\n' ' ' | head -c 3000)
            fi
            echo "::error title=Gradle log::$ERR"
            LOG_SIMPLE=$(grep -i -A10 "FAILURE\|e: \|error:" /tmp/gradle.log 2>&1 | head -n 80 | tr -cd '[:print:]\n' | head -c 6000)
            if [ -z "$LOG_SIMPLE" ]; then LOG_SIMPLE=$(head -n 80 /tmp/gradle.log | head -c 6000); fi
            echo "$LOG_SIMPLE" | head -n 40
            gh api repos/${{ github.repository }}/issues -f title="Gradle failure ${{ github.sha }}" -f body="$LOG_SIMPLE" 2>&1 | head -n 20 || echo "issue creation failed"
          else
            echo "::error::No gradle log found"
          fi

      - name: Upload gradle log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: /tmp/gradle.log
          retention-days: 7
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GuardCall-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/**/*.apk
            android/**/build/outputs/**/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Run unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest || echo "no tests yet — ok"
