name: Release APK

on:
  push:
    branches: ["arena/**"]
    paths:
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag à publier (ex: v1.0)'
        required: true
        default: 'v1.0'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build APK & Attach to Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Generate Gradle Wrapper if missing
        working-directory: android
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.7
          fi
          ls -lh gradle/wrapper/

      - name: Build Debug APK
        working-directory: android
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi
          ls -lh app/build/outputs/apk/debug/

      - name: Rename APK for release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./GuardCall-debug.apk
          ls -lh GuardCall-debug.apk

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Détermine le tag : input pour workflow_dispatch, sinon v1.0 par défaut
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="v1.0"; fi
          echo "Uploading to tag: $TAG"
          gh release view "$TAG" 2>&1 | head -n 20 || echo "release view failed (maybe not yet created)"
          # Crée la release si elle n'existe pas
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Creating release $TAG"
            gh release create "$TAG" --title "GuardCall $TAG" --notes "Release auto via workflow" --target "${{ github.sha }}" 2>&1 | head -n 20 || true
          fi
          # Upload (clobber)
          gh release upload "$TAG" ./GuardCall-debug.apk --clobber 2>&1 | tail -n 30
          echo "Upload done, listing assets:"
          gh release view "$TAG" --json assets --jq '.assets[].name' 2>&1 | head -n 20 || true
          gh release view "$TAG" 2>&1 | head -n 40 || true
