name: Release APK

on:
  push:
    branches: ["arena/**"]
    paths:
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag à publier (ex: v1.0)'
        required: true
        default: 'v1.0'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build APK & Attach to Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Generate Gradle Wrapper if missing
        working-directory: android
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.7
          fi
          ls -lh gradle/wrapper/

      - name: Build Debug APK
        working-directory: android
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi
          ls -lh app/build/outputs/apk/debug/

      - name: Rename APK for release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./GuardCall-debug.apk
          ls -lh GuardCall-debug.apk

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          # Supprime l'ancien asset s'il existe (clobber)
          gh release view "$TAG" 2>&1 | head -n 20 || echo "release view failed"
          # Upload (clobber)
          gh release upload "$TAG" ./GuardCall-debug.apk --clobber 2>&1 | tail -n 20
          echo "Upload done, listing assets:"
          gh release view "$TAG" --json assets --jq '.assets[].name' 2>&1 | head -n 20 || true
          # Also upload via api fallback if gh upload fails
          if ! gh release view "$TAG" --json assets --jq '.assets[].name' 2>&1 | grep -q "GuardCall-debug.apk"; then
            echo "Fallback upload via api..."
            # Use gh api to upload? gh release upload should have worked
            ls -lh GuardCall-debug.apk
          fi
