name: Release APK

# Publication à la demande. Le tag n'est plus codé en dur : par défaut il est
# dérivé de `versionName` dans android/app/build.gradle.kts, ce qui évite
# d'écraser par erreur les assets d'une release précédente.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de release (laisser vide pour utiliser v<versionName>)'
        required: false
        default: ''
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build APK & attach to release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(grep -oE 'versionName = "[^"]+"' android/app/build.gradle.kts | cut -d'"' -f2)
          TAG="${{ inputs.tag }}"
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
          fi
          if [ -z "$TAG" ]; then
            TAG="v${VERSION}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag retenu : $TAG"

      - name: Build debug APK
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest assembleDebug --stacktrace
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          test -n "$APK" || { echo "::error::Aucun APK produit"; exit 1; }
          echo "$APK" > /tmp/apk_path

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=$(cat /tmp/apk_path)
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${{ steps.tag.outputs.version }}"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "GuardCall ${TAG}" \
              --target "$GITHUB_SHA" \
              --notes "APK debug installable, construit par la CI depuis ${GITHUB_SHA}."
          fi
          cp "$APK" "GuardCall-${VERSION}-debug.apk"
          gh release upload "$TAG" "GuardCall-${VERSION}-debug.apk" --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'
